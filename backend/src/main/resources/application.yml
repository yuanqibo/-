server:
  port: ${PORT:5387}
  address: ${HOST:0.0.0.0}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: asset_session
        http-only: true
        same-site: lax
      timeout: 7d

spring:
  application:
    name: access-assets-server
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/asset_portal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USER:asset_portal}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  web:
    resources:
      static-locations: classpath:/static/,file:./dist/
      cache:
        cachecontrol:
          no-store: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

asset-portal:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:${PORT:5387}}
  ecp-api-base-url: ${ECP_API_BASE_URL:https://access.acg.team/api/v1}
  approval:
    enabled: ${APPROVAL_INTEGRATION_ENABLED:false}
    template-code: ${APPROVAL_TEMPLATE_CODE:}
    main-table-code: ${APPROVAL_MAIN_TABLE_CODE:MAIN}
    callback-url: ${APPROVAL_CALLBACK_URL:}
    callback-processing-delay-ms: ${APPROVAL_CALLBACK_PROCESSING_DELAY_MS:2000}
    reconciliation-delay-ms: ${APPROVAL_RECONCILIATION_DELAY_MS:30000}
    reconciliation-interval-ms: ${APPROVAL_RECONCILIATION_INTERVAL_MS:60000}
  system-config:
    encryption-key: ${ASSET_PORTAL_SYSTEM_CONFIG_ENCRYPTION_KEY:}
  security:
    tenant-id: ${ECP_TENANT_ID:}
    allow-unauthenticated-api-for-tests: ${ALLOW_UNAUTHENTICATED_TEST_MODE:false}
  store:
    max-keys-per-request: ${STORE_MAX_KEYS_PER_REQUEST:100}
    max-value-bytes: ${STORE_MAX_VALUE_BYTES:10485760}

ecp:
  sdk:
    enabled: ${ECP_SDK_ENABLED:true}
    base-url: ${ECP_SDK_BASE_URL:${ECP_API_BASE_URL:https://access.acg.team/api/v1}}
    app-code: WLY5YG
    app-secret: ${ECP_APP_SECRET:}
    application-name: access-assets-server
    connect-timeout: 3s
    read-timeout: 10s
    permission:
      enabled: ${ECP_SDK_PERMISSION_ENABLED:false}
      snapshot-signing-secret: ${ECP_SDK_PERMISSION_SNAPSHOT_SIGNING_SECRET:}
