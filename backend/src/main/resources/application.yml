server:
  port: ${PORT:5387}
  address: ${HOST:0.0.0.0}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: asset_session
        http-only: true
        same-site: lax
      timeout: 7d

spring:
  application:
    name: access-assets-server
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/app-store;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  web:
    resources:
      static-locations: file:./dist/
      cache:
        cachecontrol:
          no-store: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

asset-portal:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:${PORT:5387}}
  ecp-api-base-url: ${ECP_API_BASE_URL:https://access.acg.team/api/v1}
  feishu:
    app-id: ${FEISHU_APP_ID:${LARK_APP_ID:}}
    app-secret: ${FEISHU_APP_SECRET:${LARK_APP_SECRET:}}
  admin-accounts: ${ASSET_ADMIN_ACCOUNTS:}
  store:
    max-keys-per-request: ${STORE_MAX_KEYS_PER_REQUEST:100}
    max-value-bytes: ${STORE_MAX_VALUE_BYTES:10485760}

ecp:
  sdk:
    enabled: ${ECP_SDK_ENABLED:true}
    base-url: ${ECP_SDK_BASE_URL:${ECP_API_BASE_URL:https://access.acg.team/api/v1}}
    app-code: WLY5YG
    app-secret: ${ECP_APP_SECRET:}
    application-name: access-assets-server
    connect-timeout: 3s
    read-timeout: 10s
    permission:
      enabled: true
      snapshot-signing-secret: ${ECP_SDK_PERMISSION_SNAPSHOT_SIGNING_SECRET:}
