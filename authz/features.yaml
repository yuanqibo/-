features:
  - code: ASSET_PORTAL_ROOT
    name: 资产管理系统
    type: GROUP
    sort: 10
    permissions: []
  - code: PORTAL_HOME
    name: 首页概览
    type: FEATURE
    parentCode: ASSET_PORTAL_ROOT
    sort: 10
    permissions:
      - asset:item:view
  - code: PORTAL_ASSETS
    name: 资产管理
    type: FEATURE
    parentCode: ASSET_PORTAL_ROOT
    sort: 20
    permissions:
      - asset:item:view
      - asset:inbound:view
      - asset:receive_return:view
      - asset:borrow_return:view
      - asset:stocktake:view
      - asset:stocktake:update
      - asset:consumable:view
      - asset:consumable:create
      - asset:consumable:adjust
      - asset:repair:view
      - asset:repair:create
      - asset:repair:update
      - asset:contract:view
      - asset:contract:create
  - code: PORTAL_REQUESTS
    name: 审批申请
    type: FEATURE
    parentCode: ASSET_PORTAL_ROOT
    sort: 30
    permissions:
      - asset:request:view
      - asset:request:create
  - code: PORTAL_SETTINGS
    name: 系统设置
    type: FEATURE
    parentCode: ASSET_PORTAL_ROOT
    sort: 40
    permissions:
      - asset:employee:view
      - asset:department:view
      - asset:self_service:view
      - asset:integration:view
      - asset:form:view
  - code: APP_WORKSPACE
    name: 账号管理
    type: FEATURE
    parentCode: ASSET_PORTAL_ROOT
    sort: 90
    permissions:
      - authz:application:view
      - authz:model:view
      - authz:app_role:view
