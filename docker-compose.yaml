services:
  mysql:
    image: mysql:8.4
    container_name: asset-portal-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-asset_portal}"
      MYSQL_USER: "${DATABASE_USER:-asset_portal}"
      MYSQL_PASSWORD: "${DATABASE_PASSWORD:-asset_portal_change_me}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-asset_portal_root_change_me}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-33306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  asset-portal:
    container_name: asset-portal
    image: asset-platform:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ASSET_PORTAL_PORT:-5387}:5387"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5387
      DATABASE_URL: "${DATABASE_URL:-jdbc:mysql://mysql:3306/asset_portal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
      DATABASE_USER: "${DATABASE_USER:-asset_portal}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:-asset_portal_change_me}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://172.20.230.29:5387}"
      ECP_API_BASE_URL: "${ECP_API_BASE_URL:-https://access.acg.team/api/v1}"
      ECP_SDK_ENABLED: "${ECP_SDK_ENABLED:-true}"
      ECP_SDK_BASE_URL: "${ECP_SDK_BASE_URL:-https://access.acg.team/api/v1}"
      ECP_APP_SECRET: "${ECP_APP_SECRET:-}"
      ECP_SDK_PERMISSION_SNAPSHOT_SIGNING_SECRET: "${ECP_SDK_PERMISSION_SNAPSHOT_SIGNING_SECRET:-}"
      ASSET_ADMIN_ACCOUNTS: "${ASSET_ADMIN_ACCOUNTS:-}"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: >
        wget -qO- http://127.0.0.1:5387/actuator/health >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mysql-data:
