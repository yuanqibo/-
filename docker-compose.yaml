services:
  asset-portal:
    container_name: asset-portal
    image: "${ASSET_PORTAL_IMAGE:-asset-platform:latest}"
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5387
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      DATABASE_USER: "${DATABASE_USER:-asset_portal}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:5387}"
      ECP_API_BASE_URL: "${ECP_API_BASE_URL:-https://access.acg.team/api/v1}"
      ECP_SDK_ENABLED: "${ECP_SDK_ENABLED:-true}"
      ECP_SDK_BASE_URL: "${ECP_SDK_BASE_URL:-https://access.acg.team/api/v1}"
      ECP_APP_SECRET: "${ECP_APP_SECRET:?ECP_APP_SECRET is required}"
      APPROVAL_INTEGRATION_ENABLED: "${APPROVAL_INTEGRATION_ENABLED:-false}"
      APPROVAL_TEMPLATE_CODE: "${APPROVAL_TEMPLATE_CODE:-}"
      APPROVAL_MAIN_TABLE_CODE: "${APPROVAL_MAIN_TABLE_CODE:-MAIN}"
      APPROVAL_CALLBACK_URL: "${APPROVAL_CALLBACK_URL:-}"
      ECP_SDK_PERMISSION_ENABLED: "${ECP_SDK_PERMISSION_ENABLED:-false}"
      ECP_SDK_PERMISSION_SNAPSHOT_SIGNING_SECRET: "${ECP_SDK_PERMISSION_SNAPSHOT_SIGNING_SECRET:-}"
      ECP_TENANT_ID: "${ECP_TENANT_ID:-}"
      ASSET_PORTAL_SYSTEM_CONFIG_ENCRYPTION_KEY: "${ASSET_PORTAL_SYSTEM_CONFIG_ENCRYPTION_KEY:?ASSET_PORTAL_SYSTEM_CONFIG_ENCRYPTION_KEY is required}"
      ALLOW_UNAUTHENTICATED_TEST_MODE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5387/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
