<?xml version="1.0" encoding="UTF-8"?>
<!--
  Editable asset label template, sized for 40 x 60 mm printing.
  Edit the three text elements below and replace asset-code-template-qr.svg
  when the asset code changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="40mm" height="60mm" viewBox="0 0 400 600">
  <title>Asset code label</title>
  <desc>QR code, asset ID, asset name, and ownership notice.</desc>

  <style>
    .outline { fill: none; stroke: #111; stroke-width: 4; }
    .label-text { fill: #111; font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; }
  </style>

  <!-- Rotate the existing 60 x 40 mm layout onto the 40 x 60 mm label. -->
  <g id="label-content" transform="translate(400 0) rotate(90)">
  <!-- Outer boundary, sized for 40 x 60 mm label stock. -->
  <rect id="label-boundary" x="6" y="6" width="588" height="388" rx="16" ry="16"
        fill="#fff" stroke="#111" stroke-width="4"/>

  <!-- Independent content cells. Their borders do not join one another. -->
  <g id="print-grid" class="outline">
    <rect id="qr-cell" x="12" y="14" width="181" height="236"/>
    <rect id="code-cell" x="199" y="14" width="389" height="115"/>
    <rect id="name-cell" x="199" y="135" width="389" height="115"/>
    <rect id="ownership-cell" x="12" y="256" width="576" height="130"/>
  </g>

  <!-- QR code for 010100123. Regenerate from asset-code-template-qr.svg if the ID changes. -->
  <g id="asset-qr-code" transform="translate(28 57) scale(7.12)">
    <rect x="0" y="0" width="21" height="21" fill="#fff"/>
    <path fill="none" stroke="#000" stroke-width="1" transform="translate(0 0.5)"
          d="M0 0h1M1 0h1M2 0h1M3 0h1M4 0h1M5 0h1M6 0h1M10 0h1M12 0h1M14 0h1M15 0h1M16 0h1M17 0h1M18 0h1M19 0h1M20 0h1M0 1h1M6 1h1M12 1h1M14 1h1M20 1h1M0 2h1M2 2h1M3 2h1M4 2h1M6 2h1M8 2h1M10 2h1M14 2h1M16 2h1M17 2h1M18 2h1M20 2h1M0 3h1M2 3h1M3 3h1M4 3h1M6 3h1M12 3h1M14 3h1M16 3h1M17 3h1M18 3h1M20 3h1M0 4h1M2 4h1M3 4h1M4 4h1M6 4h1M9 4h1M11 4h1M12 4h1M14 4h1M16 4h1M17 4h1M18 4h1M20 4h1M0 5h1M6 5h1M9 5h1M10 5h1M11 5h1M14 5h1M20 5h1M0 6h1M1 6h1M2 6h1M3 6h1M4 6h1M5 6h1M6 6h1M8 6h1M10 6h1M12 6h1M14 6h1M15 6h1M16 6h1M17 6h1M18 6h1M19 6h1M20 6h1M8 7h1M10 7h1M0 8h1M1 8h1M2 8h1M4 8h1M5 8h1M6 8h1M7 8h1M8 8h1M10 8h1M12 8h1M13 8h1M14 8h1M18 8h1M2 9h1M4 9h1M5 9h1M7 9h1M9 9h1M10 9h1M11 9h1M13 9h1M15 9h1M17 9h1M19 9h1M20 9h1M2 10h1M3 10h1M6 10h1M8 10h1M9 10h1M11 10h1M13 10h1M14 10h1M15 10h1M17 10h1M18 10h1M0 11h1M3 11h1M9 11h1M10 11h1M11 11h1M12 11h1M13 11h1M15 11h1M16 11h1M17 11h1M18 11h1M19 11h1M1 12h1M3 12h1M4 12h1M6 12h1M7 12h1M8 12h1M11 12h1M13 12h1M14 12h1M15 12h1M17 12h1M18 12h1M20 12h1M8 13h1M10 13h1M14 13h1M17 13h1M19 13h1M0 14h1M1 14h1M2 14h1M3 14h1M4 14h1M5 14h1M6 14h1M8 14h1M9 14h1M12 14h1M16 14h1M18 14h1M19 14h1M20 14h1M0 15h1M6 15h1M8 15h1M9 15h1M14 15h1M19 15h1M20 15h1M0 16h1M2 16h1M3 16h1M4 16h1M6 16h1M8 16h1M9 16h1M10 16h1M12 16h1M14 16h1M16 16h1M17 16h1M20 16h1M0 17h1M2 17h1M3 17h1M4 17h1M6 17h1M11 17h1M13 17h1M15 17h1M17 17h1M18 17h1M19 17h1M0 18h1M2 18h1M3 18h1M4 18h1M6 18h1M8 18h1M11 18h1M13 18h1M14 18h1M15 18h1M17 18h1M20 18h1M0 19h1M6 19h1M8 19h1M9 19h1M10 19h1M11 19h1M12 19h1M13 19h1M15 19h1M16 19h1M17 19h1M0 20h1M1 20h1M2 20h1M3 20h1M4 20h1M5 20h1M6 20h1M8 20h1M9 20h1M11 20h1M13 20h1M14 20h1M15 20h1M18 20h1M20 20h1"/>
  </g>

  <!-- Editable fields -->
  <text id="asset-code" class="label-text" x="215" y="92" font-size="40">010100123</text>
  <text id="asset-name" class="label-text" x="215" y="212" font-size="38">MacBookProM1</text>
  <text id="ownership-notice" class="label-text" x="300" y="338" font-size="33" text-anchor="middle">此资产归Access集团所有</text>
  </g>
</svg>
